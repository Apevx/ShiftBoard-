services:
  shiftboard:
    image: ghcr.io/apevx/shiftboard:latest
    container_name: shiftboard
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      TZ: Australia/Sydney
      # Protects editing. Share links / calendar feed stay public (read-only).
      ADMIN_PASSWORD: change-me
      # Optional: the public address people outside your LAN will use, e.g. https://shifts.example.com
      # PUBLIC_URL: https://shifts.example.com
      APP_TITLE: My Shifts
      BACKUP_DIR: /backups
      BACKUP_KEEP: "30"
    volumes:
      - ./data:/data
      # Point this at a different disk or NAS share if you can
      - ./backups:/backups
